account_id = "de6abc05e3316338d8ee2c1ecadcb407"
name = "roboz-trade"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[dev]
port = 8787

# Static Assets Configuration - Serves React frontend
[assets]
directory = "../frontend/dist"  # Path to built frontend assets
binding = "ASSETS"               # Binding name to access assets in Worker code
not_found_handling = "single-page-application"  # SPA mode for React Router
run_worker_first = ["/api/*", "/ws"]  # Run Worker code first for API and WebSocket routes

[[d1_databases]]
binding = "DB"
database_name = "roboz-trade"
database_id = "21149666-00d4-4966-9065-b2769cc71a5a"
migrations_dir = "drizzle"

[durable_objects]
bindings = [
  { name = "MARKET_WS", class_name = "MarketDataWebSocket" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarketDataWebSocket"]

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# Non-sensitive variables can be defined here in [vars]
# Sensitive variables (secrets) should be set using: wrangler secret put VARIABLE_NAME
#
# SECRETS (use `wrangler secret put`):
#   - JWT_SECRET
#   - ENCRYPTION_KEY
#
# To set secrets in production:
#   wrangler secret put JWT_SECRET
#   wrangler secret put ENCRYPTION_KEY
# ============================================================================

[vars]
# API Configuration
ASTER_API_BASE_URL = "https://fapi.asterdex.com"

# CORS Configuration
# Add your custom domain when configured
CORS_ALLOWED_ORIGINS = "http://localhost:5173,https://roboz.trade"

# Blockchain Configuration
USDT_CONTRACT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955"
PAYMENT_RECIPIENT_ADDRESS = "0xB8b687E16BD6Ce3E37e6f9fd534542F75009c86B"  # Replace with your wallet
REQUIRED_PAYMENT_AMOUNT = "10"
MIN_CONFIRMATIONS = "3"

# Crypto Configuration
PBKDF2_ITERATIONS = "100000"

# Rate Limiting (optional)
# RATE_LIMIT_WINDOW_MS = "60000"
# RATE_LIMIT_MAX_REQUESTS = "100"


